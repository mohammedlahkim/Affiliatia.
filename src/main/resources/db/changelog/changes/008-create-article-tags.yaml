databaseChangeLog:
  - changeSet:
      id: 008-create-article-tags
      author: thewise.
      changes:
        - createTable:
            tableName: article_tags
            columns:
              - column:
                  name: article_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tag_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: article_tags
            columnNames: article_id, tag_id
            constraintName: pk_article_tags
        - addForeignKeyConstraint:
            baseTableName: article_tags
            baseColumnNames: article_id
            referencedTableName: articles
            referencedColumnNames: id
            constraintName: fk_article_tags_article
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: article_tags
            baseColumnNames: tag_id
            referencedTableName: tags
            referencedColumnNames: id
            constraintName: fk_article_tags_tag
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: article_tags