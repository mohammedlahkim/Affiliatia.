databaseChangeLog:
  - changeSet:
      id: 006-create-products
      author: thewise.
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: image_url
                  type: VARCHAR(500)
              - column:
                  name: price
                  type: DECIMAL(10,2)
              - column:
                  name: merchant
                  type: VARCHAR(100)
              - column:
                  name: affiliate_url
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: products