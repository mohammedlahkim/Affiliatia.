databaseChangeLog:
  - changeSet:
      id: 004-create-articles
      author: thewise.
      changes:
        - createTable:
            tableName: articles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(250)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: excerpt
                  type: VARCHAR(500)
              - column:
                  name: meta_title
                  type: VARCHAR(160)
              - column:
                  name: meta_description
                  type: VARCHAR(300)
              - column:
                  name: canonical_url
                  type: VARCHAR(300)
              - column:
                  name: noindex
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: category_id
                  type: BIGINT
              - column:
                  name: user_id
                  type: BIGINT
      rollback:
        - dropTable:
            tableName: articles

  - changeSet:
      id: 004a-articles-category-fk
      author: thewise.
      changes:
        - addForeignKeyConstraint:
            baseTableName: articles
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_article_category
            onDelete: SET NULL
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: articles
            constraintName: fk_article_category

  - changeSet:
      id: 004b-articles-user-fk
      author: thewise.
      changes:
        - addForeignKeyConstraint:
            baseTableName: articles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_article_user
            onDelete: SET NULL
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: articles
            constraintName: fk_article_user

  - changeSet:
      id: 004c-creates-article-tag
      author: thewise.
      changes:
        - createTable:
            tableName: article_tag
            columns:
              - column:
                  name: article_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: tag_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: article_tag
            columnNames: article_id, tag_id
            constraintName: pk_article_tag
        - addForeignKeyConstraint:
            baseTableName: article_tag
            baseColumnNames: article_id
            referencedTableName: articles
            referencedColumnNames: id
            constraintName: fk_article_tag_article
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: article_tag
            baseColumnNames: tag_id
            referencedTableName: tags
            referencedColumnNames: id
            constraintName: fk_article_tag_tag
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: article_tag