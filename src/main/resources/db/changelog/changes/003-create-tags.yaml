databaseChangeLog:
  - changeSet:
      id: 003-create-tags
      author: thewise.
      changes:
        - createTable:
            tableName: tags
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(80)
                  constraints:
                    nullable: false
                    unique: true
      rollback:
        - dropTable:
            tableName: tags