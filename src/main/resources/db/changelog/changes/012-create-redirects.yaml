databaseChangeLog:
  - changeSet:
      id: 012-create-redirects
      author: thewise.
      changes:
        - createTable:
            tableName: redirects
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: from_path
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: to_path
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: status_code
                  type: INT
                  defaultValueNumeric: 301
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: redirects